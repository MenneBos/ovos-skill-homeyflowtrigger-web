services:
  homeyflowtrigger:
    build:
      context: .
      args:
        TAG: ${TAG:-latest}
    container_name: homeyflowtrigger
    restart: unless-stopped
    network_mode: host
    environment:
      HOMEYFLOW_WEB_HOST: "${HOMEYFLOW_WEB_HOST:-0.0.0.0}"
      HOMEYFLOW_WEB_PORT: "8200"
    volumes:
      - ./config:/home/ovos/.config/ovos_skill_homeyflowtrigger
      - ${OVOS_CONFIG_FOLDER:-/home/ovos/ovos/config}:/home/ovos/.config/mycroft
